name: fault-campaign-3-rerun
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build-async:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build app A image from DeathStarBench 5728790
        run: |
          ./setup_async.sh dsb_async
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/kinjal-oza/sn-async:5728790
          if ! docker manifest inspect $IMG >/dev/null 2>&1; then
            cd dsb_async/socialNetwork && docker build -q --build-arg NUM_CPUS=4 -t $IMG . && docker push -q $IMG
          fi
          docker manifest inspect $IMG | head -20
  shard:
    needs: build-async
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {app: social, shard: 0, nsh: 1, only: "69,111,121"}
          - {app: async, shard: 0, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
          - {app: async, shard: 1, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
          - {app: async, shard: 2, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
          - {app: async, shard: 3, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
          - {app: async, shard: 4, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
          - {app: async, shard: 5, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
          - {app: async, shard: 6, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
          - {app: async, shard: 7, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
          - {app: async, shard: 8, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
          - {app: async, shard: 9, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
          - {app: async, shard: 10, nsh: 11, only: "45,53,55,75,80,85,90,95,100,101,102,105,110,111,115,120,121,122,125,130,131,132,135,140,141,142,145,150,151,155,160,161,162"}
    env:
      APP: ${{ matrix.app }}
      SMOKE: ""
      ONLY: ${{ matrix.only }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Kaggle credentials before running (fails fast if the token is invalid)
        if: ${{ env.SMOKE != '1' || matrix.shard == 0 }}
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install -q kaggle
          mkdir -p ~/.kaggle && printf "%s" "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token && chmod 600 ~/.kaggle/access_token
          kaggle --version; echo "token length: ${#KAGGLE_API_TOKEN}, prefix: ${KAGGLE_API_TOKEN:0:5}"
          kaggle datasets list --mine 2>&1 | head -5
          kaggle datasets list --mine >/dev/null 2>&1 || { echo "::error::Kaggle rejected the KAGGLE_API_TOKEN secret"; exit 1; }
          kaggle datasets list --mine 2>&1 | grep -q "Authentication required" && { echo "::error::Kaggle rejected the KAGGLE_API_TOKEN secret"; exit 1; }
          echo "Kaggle auth OK"
      - name: Testbed
        if: ${{ env.SMOKE != '1' || matrix.shard == 0 }}
        run: |
          sudo modprobe sch_netem || true
          pip install -q aiohttp pandas kaggle
          docker pull -q nicolaka/netshoot
          if [ "$APP" = async ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            ./setup_async.sh dsb && cd dsb/socialNetwork && docker compose pull -q && docker compose up -d && sleep 60
            python3 scripts/init_social_graph.py | tail -1
          else
            git clone -q https://github.com/delimitrou/DeathStarBench.git dsb
            cd dsb && git checkout -q 6ecb09706140f8730b5385c08f1386c654c3c526 && git apply ../dsb.patch
            if [ "$APP" = social ]; then
              cd socialNetwork && docker compose up -d && sleep 30 && python3 scripts/init_social_graph.py --graph=socfb-Reed98 | tail -1
            else
              cd hotelReservation && docker compose up -d --build && sleep 60
            fi
          fi
          docker ps --format '{{.Names}} {{.Image}}' | sort; nproc; free -g; uname -r; docker version --format '{{.Server.Version}}'
      - name: Campaign shard
        if: ${{ env.SMOKE != '1' || matrix.shard == 0 }}
        run: |
          if [ "$APP" = hotel ]; then export DSB=$GITHUB_WORKSPACE/dsb/hotelReservation; else export DSB=$GITHUB_WORKSPACE/dsb/socialNetwork; fi
          python3 campaign3.py out ${{ matrix.shard }} ${{ matrix.nsh }}
      - name: Save results as a GitHub artifact (backup)
        if: ${{ always() && (env.SMOKE != '1' || matrix.shard == 0) }}
        uses: actions/upload-artifact@v4
        with:
          name: c3r-${{ matrix.app }}-${{ matrix.shard }}
          path: out/
          retention-days: 90
          if-no-files-found: warn
      - name: Upload results to Kaggle
        if: ${{ always() && (env.SMOKE != '1' || matrix.shard == 0) }}
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          ls out/*.json >/dev/null 2>&1 || { echo "No run data in this shard; nothing to upload."; exit 0; }
          rm -f out/_probe*.csv
          P=$([ "$SMOKE" = 1 ] && echo crs-c3smoke || echo crs-c3r)
          mkdir -p ~/.kaggle && printf "%s" "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token && chmod 600 ~/.kaggle/access_token
          echo "token length: ${#KAGGLE_API_TOKEN}"
          echo "{\"title\": \"$P-${{ matrix.app }}-${{ matrix.shard }}\", \"id\": \"kinjalvaishnav/$P-${{ matrix.app }}-${{ matrix.shard }}\", \"licenses\": [{\"name\": \"other\"}]}" > out/dataset-metadata.json
          for i in 1 2 3; do
            (kaggle datasets create -p out || kaggle datasets version -p out -m "update") && exit 0
            echo "Kaggle upload attempt $i failed; retrying in 60 s"; sleep 60
          done
          exit 1
  publish:
    needs: shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arts
      - name: Attach every shard's data to a public GitHub release (backup copy, readable without login)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p rel && for d in arts/*; do tar czf rel/$(basename $d).tar.gz -C arts $(basename $d); done
          ls -la rel
          gh release create "c3r-data-${{ github.run_id }}" rel/*.tar.gz --repo "${{ github.repository }}" \
            --title "Study 3 rerun data, deviation 2 (run ${{ github.run_id }})" --notes "Raw output of every shard of fault-campaign-3 run ${{ github.run_id }} (plan: osf.io/ujdvs)."
